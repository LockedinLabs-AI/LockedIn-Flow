name: Feature request
description: Propose a focused capability or improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without including private or customer data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Does this change a trust boundary?
      options:
        - "No"
        - "Yes: permissions"
        - "Yes: network"
        - "Yes: storage or retention"
        - "Yes: text insertion"
        - "Unsure"
    validations:
      required: true
